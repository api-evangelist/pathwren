domain_standards:
- id: robots-exclusion-protocol-rfc9309
  conforms: true
  role: subject-and-emitter
  evidence:
    url: https://www.pathwren.workers.dev/robots/block-ai-training.txt
    spec_location: 'openapi.json paths./robots/{policy}.txt (operationId getRobotsPolicy), tag "robots"'
    detail: >-
      The domain standard for this provider's market IS the Robots Exclusion Protocol, and the
      contract declares it structurally rather than claiming it in prose: a templated operation
      emitting ready-to-paste robots.txt for eight named stances, a matching
      /policy/{policy}.json describing each stance, and a `robots_token` plus
      `respects_robots_txt` field on every record in components.schemas.Crawler. A consumer who
      already speaks robots.txt needs no bespoke connector — the response body IS the standard's
      own wire format.
