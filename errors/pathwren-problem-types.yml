machine_readable_refusals:
- paths:
  - /.well-known/oauth-authorization-server
  - /.well-known/oauth-protected-resource
  - /.well-known/openid-configuration
  status: 404
  content_type: application/json
  detail: >-
    The one place this host answers an error in JSON, and deliberately. The provider documents it
    in /.well-known/mcp.json x-authorization: "404 with a JSON body — the status is the answer, the
    body is the reason." A 404 here means no authorization is required, not that discovery broke.
gaps:
- >-
  The 4xx declared on getCrawler and getIpRangeSource carry no content or schema, so a client
  cannot know from the contract what a failure body looks like.
- >-
  Error responses on the data paths are HTML, which an agent parsing JSON will not read. Adding
  application/problem+json (RFC 9457) on the two declared 404s would close the only structural gap
  in an otherwise unusually complete contract.
