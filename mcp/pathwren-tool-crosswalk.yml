source: >-
  Derived by binding the live tools/list responses (probed 2026-09-01, HTTP 200, unauthenticated)
  from all three MCP servers to the operationIds declared in the provider's own OpenAPI 3.1
  document at https://www.pathwren.workers.dev/openapi.json. Both sides are real and both were
  fetched — nothing here is mapped by guesswork about an unseen schema.
surfaces:
  openapi:
    url: https://www.pathwren.workers.dev/openapi.json
    local: openapi/pathwren-ai-crawler-index-openapi.json
    version: 3.1.0
    operations: 68
    gated: false
  graphql: null
  mcp:
    endpoints:
    - https://www.pathwren.workers.dev/mcp
    - https://www.pathwren.workers.dev/mcp/triage
